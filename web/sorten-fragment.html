<li class="sorte gross">

    <figcaption>
      <p class="sortenname">Kafi Fertig</p>
      <p class="sortenwerte"><span class="zahl">95</span> kcal ·
        <span class="zahl roast">40</span> mg</p>
      <p class="sortentext">Drei Würfelzucker ins Glas, Kaffee darüber, bis man sie nicht mehr sieht — dann Träsch, bis man sie wieder sieht.</p>
      <p class="sortenort">Innerschweiz. In Luzern heisst er Kafi Luz oder Träschkaffee, in Bern Kafi Fertig — dasselbe Getränk. Entstanden aus Sparsamkeit: dünner Kaffee, gestreckt mit Selbstgebranntem. Die Regel dazu lautet, durch einen richtigen müsse man Zeitung lesen können.</p>
    </figcaption>
  </figure>
</li>
<li class="sorte gross">

    <figcaption>
      <p class="sortenname">Schümli Pflümli</p>
      <p class="sortenwerte"><span class="zahl">130</span> kcal ·
        <span class="zahl roast">80</span> mg</p>
      <p class="sortentext">Zucker ins vorgewärmte Stielglas, Pflümli darüber, mit Kaffee auffüllen bis einen Finger unter den Rand, Schlagrahm obenauf.</p>
      <p class="sortenort">Schweizer Wintergetränk, nach dem Skitag. „Schümli“ ist der Kaffee mit seinem Schaum, „Pflümli“ der Zwetschgenbrand dazu.</p>
    </figcaption>
  </figure>
</li>
